<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 664" width="760" height="664" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="Arquitetura em 4 camadas da Captação de Projetos">
<rect width="760" height="664" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
<text x="24" y="34" text-anchor="start" font-weight="600" font-size="15" fill="#0f172a">A IA só escreve com contexto do banco vetorial, e a equipe decide cada passo</text>
<rect x="24" y="56" width="712" height="104" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="720" y="78" text-anchor="end" font-weight="600" fill="#0f172a">1 · Entrada</text>
<rect x="24" y="184" width="712" height="184" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="720" y="206" text-anchor="end" font-weight="600" fill="#0f172a">2 · Pipeline de IA (gera rascunho)</text>
<rect x="24" y="392" width="712" height="104" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="720" y="414" text-anchor="end" font-weight="600" fill="#0f172a">3 · Decisão humana (GTI)</text>
<rect x="24" y="520" width="712" height="120" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="720" y="542" text-anchor="end" font-weight="600" fill="#0f172a">4 · Observabilidade (OpenTelemetry)</text>
<g fill="none" stroke="#94a3b8" stroke-width="1.25"><path d="M288 116H472" marker-end="url(#a)"/><path d="M592 144V170H148V216" marker-end="url(#a)"/><path d="M248 244H280" marker-end="url(#a)"/><path d="M512 244H480" marker-end="url(#a)"/><path d="M380 272V296" marker-end="url(#a)"/><path d="M480 324H512" marker-end="url(#a)"/><path d="M612 352V380H123V424" marker-end="url(#a)"/><path d="M198 452H218" marker-end="url(#a)"/><path d="M368 452H388" marker-end="url(#a)"/><path d="M538 452H558" marker-end="url(#a)"/><path d="M258 588H274" marker-end="url(#a)"/><path d="M484 588H500" marker-end="url(#a)"/><path d="M736 276H750V580H736" stroke-dasharray="4 4" marker-end="url(#a)"/></g>
<rect x="48" y="88" width="240" height="56" rx="8" fill="#ffffff" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"/><text x="168.0" y="110" text-anchor="middle" font-weight="600" fill="#0f172a">Formulário (Microsoft Forms)</text><text x="168.0" y="128" text-anchor="middle" font-size="11.5" fill="#475569">o solicitante descreve a dor</text>
<rect x="472" y="88" width="240" height="56" rx="8" fill="#ffffff" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"/><text x="592.0" y="110" text-anchor="middle" font-weight="600" fill="#0f172a">Pedido no SharePoint</text><text x="592.0" y="128" text-anchor="middle" font-size="11.5" fill="#475569">um item por demanda</text>
<rect x="48" y="216" width="200" height="56" rx="8" fill="#ffffff" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"/><text x="148.0" y="238" text-anchor="middle" font-weight="600" fill="#0f172a">Agente de pré-esboço</text><text x="148.0" y="256" text-anchor="middle" font-size="11.5" fill="#475569">orquestra busca e geração</text>
<rect x="280" y="216" width="200" height="56" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="380.0" y="238" text-anchor="middle" font-weight="600" fill="#0f172a">Busca semântica (RAG)</text><text x="380.0" y="256" text-anchor="middle" font-size="11.5" fill="#0f172a">Supabase Vector (pgvector)</text>
<rect x="512" y="216" width="200" height="56" rx="8" fill="#ffffff" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"/><text x="612.0" y="238" text-anchor="middle" font-weight="600" fill="#0f172a">Biblioteca de Projetos</text><text x="612.0" y="256" text-anchor="middle" font-size="11.5" fill="#475569">modelos em embeddings</text>
<rect x="280" y="296" width="200" height="56" rx="8" fill="#ffffff" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"/><text x="380.0" y="318" text-anchor="middle" font-weight="600" fill="#0f172a">LLM (Claude)</text><text x="380.0" y="336" text-anchor="middle" font-size="11.5" fill="#475569">prompt + trechos recuperados</text>
<rect x="512" y="296" width="200" height="56" rx="8" fill="#ffffff" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"/><text x="612.0" y="318" text-anchor="middle" font-weight="600" fill="#0f172a">Pré-esboço (rascunho)</text><text x="612.0" y="336" text-anchor="middle" font-size="11.5" fill="#475569">nada segue sem revisão</text>
<rect x="48" y="424" width="150" height="56" rx="8" fill="#ffffff" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"/><text x="123.0" y="446" text-anchor="middle" font-weight="600" fill="#0f172a">Triagem (Teams)</text><text x="123.0" y="464" text-anchor="middle" font-size="11.5" fill="#475569">decisão com motivo</text>
<rect x="218" y="424" width="150" height="56" rx="8" fill="#ffffff" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"/><text x="293.0" y="446" text-anchor="middle" font-weight="600" fill="#0f172a">Entendimento</text><text x="293.0" y="464" text-anchor="middle" font-size="11.5" fill="#475569">com o solicitante</text>
<rect x="388" y="424" width="150" height="56" rx="8" fill="#ffffff" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"/><text x="463.0" y="446" text-anchor="middle" font-weight="600" fill="#0f172a">Kit com RAG</text><text x="463.0" y="464" text-anchor="middle" font-size="11.5" fill="#475569">documentação gerada</text>
<rect x="558" y="424" width="150" height="56" rx="8" fill="#ffffff" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"/><text x="633.0" y="446" text-anchor="middle" font-weight="600" fill="#0f172a">Homologação</text><text x="633.0" y="464" text-anchor="middle" font-size="11.5" fill="#475569">e entrada no backlog</text>
<rect x="48" y="552" width="210" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"/><text x="153.0" y="574" text-anchor="middle" font-weight="600" fill="#0f172a">Traces por chamada</text><text x="153.0" y="592" text-anchor="middle" font-size="11.5" fill="#475569">tokens, latência e custo</text><text x="153.0" y="608" text-anchor="middle" font-size="11.5" fill="#475569">e trechos recuperados</text>
<rect x="274" y="552" width="210" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"/><text x="379.0" y="574" text-anchor="middle" font-weight="600" fill="#0f172a">Painel de observabilidade</text><text x="379.0" y="592" text-anchor="middle" font-size="11.5" fill="#475569">qualidade e erros</text><text x="379.0" y="608" text-anchor="middle" font-size="11.5" fill="#475569">por etapa do pipeline</text>
<rect x="500" y="552" width="212" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"/><text x="606.0" y="574" text-anchor="middle" font-weight="600" fill="#0f172a">Relatório semanal</text><text x="606.0" y="592" text-anchor="middle" font-size="11.5" fill="#475569">fluxo agendado consolida</text><text x="606.0" y="608" text-anchor="middle" font-size="11.5" fill="#475569">o uso da IA para a equipe</text>
</svg>